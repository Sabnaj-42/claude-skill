# KubeStash resources for the etcd backup tests. Adjust the BackupStorage endpoint/secret for a
# real object store. Matches docs/examples/etcd/backup/* but points at the in-cluster S3 test server.
apiVersion: v1
kind: Secret
metadata: {name: s3-secret, namespace: demo}
stringData: {AWS_ACCESS_KEY_ID: accessKey, AWS_SECRET_ACCESS_KEY: verySecretKey1}
---
apiVersion: v1
kind: Secret
metadata: {name: encrypt-secret, namespace: demo}
stringData: {RESTIC_PASSWORD: "etcd-test-restic-pw"}
---
apiVersion: storage.kubestash.com/v1alpha1
kind: BackupStorage
metadata: {name: s3-storage, namespace: demo}
spec:
  storage:
    provider: s3
    s3: {endpoint: "http://s3.s3.svc:8000", bucket: etcd-backups, region: us-east-1, prefix: etcd-test, secretName: s3-secret}
  usagePolicy: {allowedNamespaces: {from: All}}
  deletionPolicy: WipeOut
---
apiVersion: storage.kubestash.com/v1alpha1
kind: RetentionPolicy
metadata: {name: demo-retention, namespace: demo}
spec:
  default: true
  failedSnapshots: {last: 2}
  maxRetentionPeriod: 2mo
  successfulSnapshots: {last: 5}
  usagePolicy: {allowedNamespaces: {from: Same}}
---
apiVersion: archiver.kubedb.com/v1alpha1
kind: EtcdArchiver
metadata: {name: etcd-archiver, namespace: demo}
spec:
  databases:
    namespaces: {from: Same}
    selector: {matchLabels: {archiver: "true"}}
  backupStorage:
    ref: {name: s3-storage, namespace: demo}
    subDir: etcd-archiver
  retentionPolicy: {name: demo-retention, namespace: demo}
  encryptionSecret: {name: encrypt-secret, namespace: demo}
  fullBackup:
    driver: Restic
    scheduler:
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      schedule: "0 */2 * * *"
      jobTemplate: {backoffLimit: 1}
  manifestBackup:
    scheduler:
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      schedule: "0 */2 * * *"
      jobTemplate: {backoffLimit: 1}
  deletionPolicy: WipeOut
