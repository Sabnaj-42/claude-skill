# Self-signed CA chain for the TLS tests: ClusterIssuer -> CA Certificate -> namespaced Issuer.
# ReconfigureTLS / spec.tls reference the Issuer `etcd-ca-issuer` in namespace demo.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: etcd-selfsigned}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: etcd-ca, namespace: demo}
spec:
  isCA: true
  commonName: etcd-ca
  secretName: etcd-ca
  issuerRef: {name: etcd-selfsigned, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: etcd-ca-issuer, namespace: demo}
spec:
  ca: {secretName: etcd-ca}
